<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nick Baumgarten — Architecture Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      border: none;
    }
    .fallback {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background: #1a1a1a;
      color: #ccc;
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .fallback a {
      display: inline-block;
      padding: 12px 28px;
      background: white;
      color: #111;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <iframe
    src="portfolio.pdf"
    title="Nick Baumgarten Architecture Portfolio"
    id="pdf-frame"
  ></iframe>

  <div class="fallback" id="fallback">
    <p>Your browser couldn't display the PDF inline.</p>
    <a href="portfolio.pdf" download>Download Portfolio PDF</a>
  </div>

  <script>
    const frame = document.getElementById('pdf-frame');
    const fallback = document.getElementById('fallback');
    frame.onerror = function () {
      frame.style.display = 'none';
      fallback.style.display = 'flex';
    };
  </script>
</body>
</html>
